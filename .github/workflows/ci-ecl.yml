# ECL on macOS.
#
# A separate workflow rather than a leg of ci-macos.yml, and deliberately so:
# that file's matrix varies the RUNNER, this varies the IMPLEMENTATION.  Folding
# it in would make the single badge mean "both, mostly", and the point of that
# badge is that it means "both pass".
#
# WHAT THIS PROVES, HONESTLY.  ECL cannot build the .app -- asdf-macos-app is
# SBCL-only -- and cannot reach the UI, Metal or CoreText at all.  It runs the
# PORTABLE suite: the arithmetic, the fourteen profiles, the terminal core and
# the pty.  That is a bit over half the checks and none of the pixels.
#
# The payoff is ENFORCEMENT rather than coverage, and it has already paid twice.
# The portable half is supposed to be free of Objective-C and of SBCL-isms,
# which is a property nobody maintains by intending to.  On its first real run
# this leg found (SETF PROFILE-BLOOM) used through FDEFINITION -- which works on
# SBCL and does not on ECL, where a DEFSTRUCT accessor's setf is an expander
# rather than a function -- and a profile test reaching into CRT.TEXT, which is
# not portable at all.  Neither is visible from the SBCL legs.
#
# A STOCK ECL IS ENOUGH, and that is worth saying because it was not obvious.
# The objc bindings need a patched ECL: `dlsym(0, ...)' is not the global scope
# on Darwin, so CFFI's :default module resolves nothing and even strlen cannot
# be found.  But the portable half never loads objc, and it reaches its one C
# library through a NAMED cffi:define-foreign-library rather than :default -- so
# Homebrew's ECL runs it.  This used to build lispnik/ecl's develop from source,
# which cost six minutes a run to test something this leg never exercises.

name: ECL

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ecl · macos-latest (arm64)
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Install ECL
        run: |
          brew install ecl
          ecl --version

      - name: Build the vendored library
        run: make -C vendor && make -C vendor check

      # ocicl's installer is an SBCL program, but what it produces is a
      # directory of source and ocicl-runtime.lisp is implementation-agnostic.
      # So it is installed with SBCL and used from ECL.
      - name: Install SBCL, for ocicl only
        run: brew install sbcl

      - name: Install and configure ocicl
        run: |
          git clone --depth 1 https://github.com/ocicl/ocicl.git "$HOME/ocicl-src"
          ( cd "$HOME/ocicl-src" && sbcl --non-interactive --load setup.lisp )
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ocicl setup
          for attempt in 1 2 3 4 5; do
            ocicl install 2>&1 | tee ocicl-install.log
            grep -q "failed to install" ocicl-install.log || break
            echo "::warning::ocicl install attempt $attempt did not get every package"
            sleep 30
          done
          if grep -q "failed to install" ocicl-install.log; then
            echo "::error::ocicl could not install every dependency after 5 attempts" >&2
            exit 1
          fi

      - name: Report the environment
        run: |
          ecl --norc \
            --eval '(require :asdf)' \
            --eval '(format t "~&ECL ~A on ~A~%" (lisp-implementation-version) (machine-type))' \
            --eval "(format t \":default resolves strlen: ~A (not needed here -- the portable half opens its library by name)~%\" (and (ignore-errors (si:find-foreign-symbol \"strlen\" :default :pointer-void 0)) t))" \
            --eval '(ext:quit)'

      # Tier 1 only, and named as such: the portable half of the program.
      # Loading :cathode-ray-tube would pull in objc and the UI, which is not
      # what this leg is for.
      # See the note on the same step in ci-macos.yml: a deadlock hangs rather
      # than fails, and a hang reports "cancelled" with nothing in it to read.
      - name: Run the portable suite
        timeout-minutes: 8
        run: |
          ecl --norc \
            --eval '(require :asdf)' \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :tree (uiop:getcwd)) :ignore-inherited-configuration))' \
            --eval '(asdf:load-system :cathode-ray-tube/portable-tests)' \
            --eval '(ext:quit (if (cathode-ray-tube/tests:run-portable-tests) 0 1))'
