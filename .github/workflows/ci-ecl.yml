# ECL on macOS.
#
# A separate workflow rather than a leg of ci-macos.yml, and deliberately so:
# that file's matrix varies the RUNNER, this varies the IMPLEMENTATION.  Folding
# it in would make the single badge mean "both, mostly", and the point of that
# badge is that it means "both pass".
#
# WHAT THIS PROVES, HONESTLY.  ECL cannot build the .app -- asdf-macos-app is
# SBCL-only -- and cannot reach the UI, Metal or CoreText at all.  It runs the
# PORTABLE suite: the arithmetic, the fourteen profiles, the terminal core and
# the pty.  That is a bit over half the checks and none of the pixels.
#
# The payoff is ENFORCEMENT rather than coverage, and it has already paid twice.
# The portable half is supposed to be free of Objective-C and of SBCL-isms,
# which is a property nobody maintains by intending to.  On its first real run
# this leg found (SETF PROFILE-BLOOM) used through FDEFINITION -- which works on
# SBCL and does not on ECL, where a DEFSTRUCT accessor's setf is an expander
# rather than a function -- and a profile test reaching into CRT.TEXT, which is
# not portable at all.  Neither is visible from the SBCL legs.
#
# WHICH ECL, and why it MUST be the fork.  This leg builds lispnik/ecl's develop
# rather than installing Homebrew's, and as of src/pty/ioctl-ecl.lisp that is a
# requirement rather than a preference: stock ECL fails WINSIZE-REACHES-THE-CHILD
# and WINSIZE-ROUND-TRIPS outright, with SI:SIMPLE-PROGRAM-ERROR.  It signals
# rather than misbehaving, which is the right way round.
#
# The fork carries two fixes to the DYNAMIC FFI that stock does not have.  Both
# were measured here, on arm64:
#
#   a four-int structure passed BY VALUE into a libffi closure
#     fork:  the callback receives (3 7 11 19)
#     stock: "(STRUCT ...) does not denote an elementary foreign type"
#
#   a variadic call through si:call-cfun, with :default n-fixed
#     fork:  snprintf gives "The integer 42"
#     stock: cannot even resolve snprintf from :DEFAULT, because dlsym(0, ...)
#            is not the global scope on Darwin
#
# Those two are the whole of what a Lisp-side replacement for vendor/shim would
# need on this implementation, and the first is what the objc bindings need to
# run on ECL at all (see objc/src/abi-ecl.lisp).  Testing against the ECL that
# can do them is the point; the six minutes are cached against develop's SHA and
# only paid when it moves.

name: ECL

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ecl · macos-latest (arm64)
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      # THE FORK, not Homebrew's.  lispnik/ecl carries two fixes to the dynamic
      # FFI that stock ECL does not have, and both are measurable in one line
      # each -- see "Prove it is the fork" below, which is not ceremony.
      - name: Resolve lispnik/ecl develop
        id: ecl
        run: |
          sha=$(git ls-remote https://github.com/lispnik/ecl.git refs/heads/develop | cut -f1)
          [ -n "$sha" ] || { echo "could not resolve lispnik/ecl develop" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "resolved develop to $sha"

      # Keyed on the SHA, so a new commit on develop rebuilds and nothing else
      # does.  A build is about six minutes; a hit is a few seconds.
      - name: Cache the built ECL
        id: ecl-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/ecl
          key: ecl-${{ runner.os }}-${{ runner.arch }}-${{ steps.ecl.outputs.sha }}

      - name: Build ECL from the fork
        if: steps.ecl-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/lispnik/ecl.git "$HOME/ecl-src"
          cd "$HOME/ecl-src"
          git checkout ${{ steps.ecl.outputs.sha }}
          ./configure --prefix="$HOME/.local/ecl" --enable-threads=yes
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Put the fork on the path
        run: |
          echo "$HOME/.local/ecl/bin" >> "$GITHUB_PATH"
          "$HOME/.local/ecl/bin/ecl" --version

      # A CLEAR ERROR AT THE RIGHT MOMENT.  Since ioctl-ecl.lisp landed, a run
      # that fell back to Homebrew's ECL would fail anyway -- but several minutes
      # later, in two pty tests, with a SI:SIMPLE-PROGRAM-ERROR that names
      # neither the fork nor the reason.  This says it here, in one line.
      #
      # It was load-bearing for a different reason before that, and the reason is
      # worth keeping in mind for the next exemption: the suite USED to pass on
      # stock, so a silent fallback was green having tested nothing new.
      #
      # These two probes are exactly what the fork adds and stock refuses,
      # measured on both before being written down:
      #
      #   a structure through the dynamic FFI  -- stock: "does not denote an
      #     elementary foreign type"
      #   a variadic call through it           -- stock cannot even resolve a
      #     symbol from :DEFAULT, because dlsym(0, ...) is not the global scope
      #     on Darwin
      - name: Prove it is the fork
        run: |
          ecl --norc --eval '
            (handler-case
                (let ((buf (ffi:allocate-foreign-object (quote (:array :int 4))))
                      (rect (quote (:struct (:m :int) (:m :int) (:m :int) (:m :int)))))
                  (loop for i below 4 for v in (list 3 7 11 19)
                        do (setf (ffi:deref-array buf (quote (:array :int 4)) i) v))
                  (let* ((cb (si::make-dynamic-callback
                              (lambda (r u)
                                (declare (ignore u))
                                (if (= 19 (ffi:deref-array r (quote (:array :int 4)) 3))
                                    0 1))
                              (quote probe) :int (list rect :pointer-void)))
                         (rc (si:call-cfun cb :int (list rect :pointer-void)
                                           (list buf (ffi:make-null-pointer :void)))))
                    (unless (zerop rc)
                      (format *error-output* "~&the struct arrived wrong~%")
                      (ext:quit 1))
                    (format t "~&ok: a struct crosses BY VALUE into a dynamic callback~%")
                    (ext:quit 0)))
              (error (c)
                (format *error-output*
                        "~&this is not the fork -- the dynamic FFI refused: ~A~%" c)
                (ext:quit 1)))'

      - name: Build the vendored library
        run: make -C vendor && make -C vendor check

      # ocicl's installer is an SBCL program, but what it produces is a
      # directory of source and ocicl-runtime.lisp is implementation-agnostic.
      # So it is installed with SBCL and used from ECL.
      - name: Install SBCL, for ocicl only
        run: brew install sbcl

      - name: Install and configure ocicl
        run: |
          git clone --depth 1 https://github.com/ocicl/ocicl.git "$HOME/ocicl-src"
          ( cd "$HOME/ocicl-src" && sbcl --non-interactive --load setup.lisp )
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ocicl setup
          # EXPONENTIAL backoff, and more of them.  A fixed thirty seconds is
          # the wrong shape for what actually goes wrong here: ghcr.io does not
          # fail one request, it has a bad few minutes.  Measured on 13 Sep,
          # when three consecutive runs died on "Failed to parse certificate ...
          # Certificate serial number must be positive" and a connection reset,
          # all five attempts inside two and a half minutes.  15s, 30s, 60s,
          # 120s, 240s, 480s spans about sixteen minutes instead.
          delay=15
          ok=""
          for attempt in 1 2 3 4 5 6 7; do
            ocicl install 2>&1 | tee ocicl-install.log
            if ! grep -q "failed to install" ocicl-install.log; then ok=yes; break; fi
            echo "::warning::ocicl install attempt $attempt did not get every package; \
                  retrying in ${delay}s"
            sleep "$delay"
            delay=$(( delay * 2 ))
          done
          if [ -z "$ok" ]; then
            echo "::error::ocicl could not install every dependency after 7 attempts \
                  spanning about sixteen minutes -- this is almost certainly ghcr.io \
                  rather than this repository" >&2
            exit 1
          fi

      - name: Report the environment
        run: |
          ecl --norc \
            --eval '(require :asdf)' \
            --eval '(format t "~&ECL ~A on ~A~%" (lisp-implementation-version) (machine-type))' \
            --eval "(format t \":default resolves strlen: ~A (not needed here -- the portable half opens its library by name)~%\" (and (ignore-errors (si:find-foreign-symbol \"strlen\" :default :pointer-void 0)) t))" \
            --eval '(ext:quit)'

      # Tier 1 only, and named as such: the portable half of the program.
      # Loading :cathode-ray-tube would pull in objc and the UI, which is not
      # what this leg is for.
      # See the note on the same step in ci-macos.yml: a deadlock hangs rather
      # than fails, and a hang reports "cancelled" with nothing in it to read.
      - name: Run the portable suite
        timeout-minutes: 8
        run: |
          ecl --norc \
            --eval '(require :asdf)' \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :tree (uiop:getcwd)) :ignore-inherited-configuration))' \
            --eval '(asdf:load-system :cathode-ray-tube/portable-tests)' \
            --eval '(ext:quit (if (cathode-ray-tube/tests:run-portable-tests) 0 1))'
